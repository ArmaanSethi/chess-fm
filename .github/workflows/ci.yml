name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install ruff
      run: pip install ruff==0.16.2
    - name: Lint
      run: ruff check .
    - name: Format check
      run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Stockfish
      run: |
        sudo apt-get update
        sudo apt-get install -y stockfish
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Run tests
      run: |
        PATH="/usr/games:$PATH" python -m pytest --cov=chessfm --cov-report=term-missing
    - name: Eval suite smoke test
      run: |
        PATH="/usr/games:$PATH" python -m chessfm.eval.suite --demo
