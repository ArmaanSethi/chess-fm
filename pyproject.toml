[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-fm"
version = "0.1.0"
description = "Engine-grounded chess reasoning models and an open-source AI Chess Coach"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    # Core CI/CPU baseline: transformers 4.52+ breaks TRL 0.16's GRPOTrainer
    # (_get_train_sampler signature drift); verified against 4.51.3.
    # For Qwen3.5 / Gemma 4 GPU runs, install the `modern` extra or use the
    # modern Modal container image in scripts/modal_train.py.
    "transformers>=4.51.0,<4.52",
    "accelerate>=0.34.0",
    "peft>=0.11.0,<0.25",
    "trl>=0.16.0,<0.17",
    "python-chess>=1.10.0",
    "datasets>=3.0.0,<6",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff==0.16.2",
    "pre-commit>=3.5.0",
]
gpu = [
    "bitsandbytes>=0.45.0",
]
modern = [
    "transformers>=5.2.0",
    "trl>=1.18.0",
    "accelerate>=1.0.0",
    "peft>=0.15.0",
    "bitsandbytes>=0.45.0",
    "wandb>=0.19.0",
    "huggingface-hub>=0.28.0",
]
coach = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
mlx = [
    "mlx>=0.0.10",
    "mlx-lm>=0.0.1",
]
unsloth = [
    "unsloth @ git+https://github.com/unslothai/unsloth.git",
]

[project.scripts]
chessfm-convert = "chessfm.data_generation.convert_to_training:main"
chessfm-generate-data = "chessfm.data_generation.generate_synthetic_data:main"
chessfm-distill-teacher = "chessfm.data_generation.distill_open_teacher:main"
chessfm-fetch-fens = "chessfm.data_generation.fetch_elite_data:main"
chessfm-train-sft = "chessfm.training.train_sft:main"
chessfm-train-grpo = "chessfm.rl.train_grpo:main"
chessfm-evaluate = "chessfm.rl.evaluate:main"
chessfm-coach = "chessfm.coach.server:main"
chessfm-eval-suite = "chessfm.eval.suite:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chessfm.coach" = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data_generation/*.jsonl", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["chessfm"]
# Coverage is measured across the whole package. Only modules whose behavior
# requires GPU hardware, model downloads, or a network endpoint to *exercise*
# (rather than import) are omitted; their entry points are smoke-tested via
# `--help` and their pure helpers are unit-tested directly.
omit = [
    "*/__pycache__/*",
    "*/chessfm/load_model.py",               # model download + 4-bit/PEFT wiring
    "*/chessfm/scripts/*",                   # tokenizer/model download utilities
    "*/chessfm/training/*",                  # GPU/torch training scripts
    "*/chessfm/rl/train_grpo.py",            # GPU/torch GRPO training script
    "*/chessfm/benchmarks/*",                # GPU inference baselines
    "*/chessfm/data_generation/fetch_elite_data.py",  # live Lichess network fetch
]

[tool.coverage.report]
fail_under = 80
show_missing = true
