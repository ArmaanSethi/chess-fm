[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-fm"
version = "0.1.0"
description = "A 3B parameter model that plays chess by reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "peft>=0.11.0",
    "trl>=0.12.0",
    "python-chess>=1.10.0",
    "bitsandbytes>=0.41.0",
    "datasets>=2.14.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "wandb>=0.16.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pre-commit>=3.5.0",
    "zstandard>=0.21.0"
]
mlx = [
    "mlx>=0.0.10",
    "mlx-lm>=0.0.1"
]

[tool.pytest.ini_options]
pythonpath = [".", "rl"]
testpaths = ["tests", "rl/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data_generation/*.jsonl", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"data_generation/fetch_elite_data.py" = ["E402"]

[tool.coverage.run]
source = ["config", "rl", "training", "tests"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.setuptools]
packages = ["rl"]
